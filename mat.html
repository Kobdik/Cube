<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Движения материалов</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/mat.css">
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/d3-selection.min.js"></script>
    <script src="./js/d3-path.min.js"></script>
    <script src="./js/exceljs.min.js"></script>
    <script type="module" src="./js/code/mat.min.js"></script>
</head>

<body>
    <div class="container-fluid">
        <div class="svg-box">
            <svg class="multi" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <clipPath id="hor-clip">
                        <rect x="0" y="0" width="500" height="100" />
                    </clipPath>
                    <clipPath id="ver-clip">
                        <rect x="0" y="0" width="100" height="500" />
                    </clipPath>
                    <clipPath id="mat-clip">
                        <rect x="0" y="0" width="500" height="500" />
                    </clipPath>
                </defs>
                <g class="corner">
                    <rect class="corner"></rect>
                    <g class="mnu-btn" transform="translate(12, 12)">
                        <rect id="mnu" class="corner" x="0" y="0" width="36" height="36" rx="6">
                            <title>Меню</title>
                        </rect>
                        <path class="mnu-icon" d="M10 12 H26 M10 18 H26 M10 24 H26" />
                    </g>
                    <text id="auth" transform="translate(16, 78)">Кобдиков Тулеген</text>
                    <text id="mail" transform="translate(16, 100)">ndi89@mail.ru</text>
                </g>
                <g class="hor-ords" clip-path="url(#hor-clip)" />
                <g class="ver-ords" clip-path="url(#ver-clip)"></g>
                <g class="matrix" clip-path="url(#mat-clip)"></g>
            </svg>
        </div>
        <dialog class="controls d-none">
            <div class="card shadow-sm border-0">
                <div class="card-header d-flex justify-content-between align-items-center py-2">
                    <span id="mat-mnu-title" class="fw-semibold">Меню</span>
                    <button type="button" class="btn-close" id="mnu-close" aria-label="Закрыть"></button>
                </div>
                <div class="list-group list-group-flush" role="menu" aria-labelledby="mat-mnu-title">
                    <button type="button" class="list-group-item list-group-item-action" id="btn-import-excel"
                        role="menuitem">
                        Загрузить из Excel
                    </button>
                    <button type="button" class="list-group-item list-group-item-action" id="btn-export-excel"
                        role="menuitem">
                        Экспорт в Excel сводных данных
                    </button>
                    <button type="button" class="list-group-item list-group-item-action" id="btn-export-source-excel"
                        role="menuitem">
                        Экспорт в Excel исходных данных
                    </button>
                    <button type="button" class="list-group-item list-group-item-action" id="btn-scale-values"
                        role="menuitem">
                        Изменить загруженные значения
                    </button>
                    <button type="button" class="list-group-item list-group-item-action" id="btn-transfer-corrections"
                        role="menuitem">
                        Перенос в корректировки
                    </button>
                </div>
            </div>
            <input type="file" id="excel-file"
                accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel"
                hidden>
        </dialog>
        <dialog class="scaling d-none">
            <div class="card shadow-sm border-0">
                <div class="card-header d-flex justify-content-between align-items-center py-2">
                    <span id="scaling-title" class="fw-semibold">Изменить загруженные значения</span>
                    <button type="button" class="btn-close" id="scaling-close" aria-label="Закрыть"></button>
                </div>
                <form class="card-body" id="scaling-form">
                    <label class="form-label mb-1" for="scaling-m">Линейный множитель</label>
                    <input class="form-control" id="scaling-m" name="m" type="text" inputmode="decimal"
                        autocomplete="off" placeholder="от -1.0 до +1.0" aria-describedby="scaling-error">
                    <div id="scaling-error" class="scaling-error" hidden></div>
                    <div class="scaling-actions">
                        <button type="button" class="btn btn-cancel" id="scaling-cancel">Отказ</button>
                        <button type="submit" class="btn btn-apply" id="scaling-apply">Применить</button>
                    </div>
                </form>
            </div>
        </dialog>
        <dialog class="scaling transfer d-none">
            <div class="card shadow-sm border-0">
                <div class="card-header d-flex justify-content-between align-items-center py-2">
                    <span id="transfer-title" class="fw-semibold">Перенос в корректировки</span>
                    <button type="button" class="btn-close" id="transfer-close" aria-label="Закрыть"></button>
                </div>
                <div class="card-body" id="transfer-form">
                    <p id="transfer-count" class="mb-0"></p>
                    <p id="transfer-sum" class="mb-0"></p>
                    <fieldset class="transfer-target" id="transfer-target" aria-describedby="transfer-error">
                        <legend>Корректировка</legend>
                    </fieldset>
                    <div id="transfer-error" class="scaling-error" hidden></div>
                    <div class="scaling-actions">
                        <button type="button" class="btn btn-cancel" id="transfer-cancel">Отказ</button>
                        <button type="button" class="btn btn-apply" id="transfer-apply">Перенести</button>
                    </div>
                </div>
            </div>
        </dialog>
    </div>
</body>
